# Documentation metadata configuration file
# This file centralizes metadata for API documentation generation

# Global documentation configuration
global:
  # Requirements for different image types
  image_requirements:
    browser_latest: "Browser automation features require the `browser_latest` image"
    code_latest: "Code execution features require the `code_latest` image"
    windows_latest: "Computer use features require the `windows_latest` image"
    mobile_latest: "Mobile automation features require the `mobile_latest` image"

  # Common best practices
  best_practices:
    error_handling: "Always check for errors after API calls and handle them appropriately"
    resource_cleanup: "Always clean up resources (sessions, contexts) when done to avoid resource leaks"
    timeout_config: "Configure appropriate timeouts based on your operation's expected duration"
    logging: "Enable logging for debugging and monitoring purposes"

  # Auto-filtering rules for internal methods/functions
  auto_filter_rules:
    # Exclude simple getter methods
    exclude_simple_getters:
      - get_api_key
      - get_client
      - get_session_id
      - get_image_id
      - get_command
      - get_mcp_tools

    # Exclude VPC-related helper methods
    exclude_vpc_helpers:
      - is_vpc
      - is_vpc_enabled
      - network_interface_ip
      - http_port
      - get_network_interface_ip
      - get_http_port_number

    # Exclude serialization methods
    exclude_serialization_methods:
      - to_map
      - from_map
      - to_dict
      - from_dict

    # Exclude marshal/unmarshal methods
    exclude_marshal_methods:
      - marshal_json
      - unmarshal_json

    # Exclude lowercase methods (Go package-private convention)
    exclude_lowercase_methods: true

    # Exclude validation methods
    exclude_validation_methods: true

    # Exclude internal helpers (check docstring for "internal" or "helper")
    exclude_internal_helpers: true

  # Java-specific configuration
  java:
    # Java Object基础方法排除
    exclude_object_methods:
      - toString
      - hashCode
      - equals
      - getClass
      - notify
      - notifyAll
      - finalize

    # Java Bean风格的getter/setter排除
    exclude_bean_methods:
      - getName
      - setName
      - getId
      - setId
      - getContextId
      - setContextId
      - getExtensionIds
      - setExtensionIds
      - getBrowserType
      - setBrowserType
      - isHeadless
      - setHeadless
      - getUserAgent
      - setUserAgent
      - getWindowSize
      - setWindowSize
      - isEnableCookie
      - setEnableCookie
      - getTimeZone
      - setTimeZone
      - getLanguage
      - setLanguage

    # Java序列化相关方法排除
    exclude_serialization_methods:
      - readObject
      - writeObject
      - readResolve
      - writeReplace
      - readObjectNoData

    # Java工具方法排除
    exclude_utility_methods:
      - validate
      - validateConfig
      - validateParams
      - clone
      - compareTo
      - callTool
      - callMcpTool
      - updateMcpTools
      - getWsClient
      - _getSession

